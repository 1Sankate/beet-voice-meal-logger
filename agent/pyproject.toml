[project]
name = "beet-agent"
version = "1.0.0"
description = "LiveKit voice agent that logs meals into the Beet API"
requires-python = ">=3.10,<3.13"
dependencies = [
    "livekit-agents~=1.8",
    "aiohttp>=3.10",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
